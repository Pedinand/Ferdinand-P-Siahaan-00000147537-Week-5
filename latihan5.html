<!doctype html>
<html>
<head>
    <title>Bilangan Ganjil</title>
</head>
<body>
    <script>
        let angka = Number(window.prompt("Masukkan angka:"));
        for (let i = 1; i <= angka; i++) {
            if (i % 2 !== 0) {
                document.write(i + " ");
            }
        }
    </script>
</body>
</html>
